<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Totem Interactivo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="stage">
    <header class="top">
      <div class="brand">
        <div class="brand-mark">i</div>
        <div>
          <h1>¿Dónde necesita ir?</h1>
          <p>Directorio de oficinas · Adquisiciones e Informática</p>
        </div>
      </div>
      <div class="clock">
        <span id="clock-time">--:--</span>
        <span id="clock-date"></span>
      </div>
    </header>

    <section id="viewport">
      <div id="labels"></div>
      <div class="view-tools">
        <button id="btn-reset" class="tool" aria-label="Volver a la vista inicial">⟲ Inicio</button>
        <button id="btn-plan" class="tool" aria-pressed="false">▦ Plano real</button>
      </div>
      <div class="legend">
        <span><i style="background:var(--tic)"></i>Informática</span>
        <span><i style="background:var(--adq)"></i>Adquisiciones</span>
        <span><i class="here"></i>Usted está aquí</span>
      </div>
    </section>

    <section id="panel">
      <div class="search">
        <div id="search-box" class="search-box" role="textbox" aria-label="Buscar trámite u oficina">
          <span class="search-icon">⌕</span>
          <span id="search-text" class="placeholder">Buscar trámite u oficina…</span>
          <button id="search-clear" class="search-clear" hidden aria-label="Borrar">✕</button>
        </div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-filter="all" role="tab">Todos</button>
        <button class="tab" data-filter="adq" role="tab">Adquisiciones</button>
        <button class="tab" data-filter="tic" role="tab">Informática</button>
      </nav>
      <div id="results" class="results"></div>
      <div id="keyboard" class="keyboard" hidden></div>
    </section>

    <aside id="detail" class="detail" hidden>
      <button id="detail-close" class="detail-close" aria-label="Cerrar">✕</button>
      <div class="detail-head">
        <div id="detail-icon" class="detail-icon"></div>
        <div>
          <div id="detail-dept" class="detail-dept"></div>
          <h2 id="detail-name"></h2>
        </div>
      </div>
      <h3>Aquí puede consultar por</h3>
      <ul id="detail-services" class="detail-services"></ul>
      <h3>Cómo llegar</h3>
      <ol id="detail-route" class="detail-route"></ol>
      <div id="detail-distance" class="detail-distance"></div>
    </aside>

    <div id="attract" class="attract">
      <div class="attract-card">
        <div class="pulse-dot"></div>
        <h2>Toque la pantalla</h2>
        <p>para encontrar oficinas y trámites</p>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
